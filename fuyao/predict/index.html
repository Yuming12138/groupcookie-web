<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20283d" />
    <meta name="description" content="上传 CIF 或 POSCAR 文件，创建材料可合成性预测任务。" />
    <title>上传预测 | Synthesis Atlas</title>
    <link rel="stylesheet" href="../homepage/styles.css" />
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="../shared/graphite-theme.css" />
  </head>
  <body data-view="predict">
    <a class="skip-link" href="#main-content">跳至主要内容</a>
    <header class="site-header">
      <a class="brand" href="../homepage/index.html" aria-label="Synthesis Atlas 首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Synthesis Atlas</span></a>
      <nav class="site-nav" aria-label="主导航"><a data-nav="elements" href="../homepage/index.html">元素检索</a><a data-nav="properties" href="../properties/index.html">性质检索</a><a class="active" data-nav="predict" href="index.html" aria-current="page">上传预测</a><a data-nav="members" href="../members/index.html">成员介绍</a></nav>
      <div class="header-actions"><button class="mobile-menu-button" id="mobile-menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><i data-lucide="menu" aria-hidden="true"></i></button></div>
    </header>

    <main class="page-main" id="main-content">
      <section class="page-intro page-intro--compact" aria-labelledby="page-title"><h1 id="page-title">上传结构，创建预测</h1></section>
      <section class="page-section" aria-labelledby="upload-title">
        <div class="view-shell predict-shell">
          <form class="predict-form-pane" id="upload-form">
            <p class="filter-kicker">输入文件</p><h2 id="upload-title">上传预测文件</h2>
            <label class="file-drop" id="dropzone" for="prediction-file"><input id="prediction-file" name="file" type="file" accept=".cif,.poscar,.vasp,.csv,.json,.txt" aria-describedby="format-help" /><span class="file-drop-icon"><i data-lucide="upload-cloud" aria-hidden="true"></i></span><strong>选择文件或拖到这里</strong><small id="format-help">结构文件：CIF / POSCAR / VASP　组成表：CSV / JSON</small><span class="selected-file" id="file-name">尚未选择文件</span></label>
            <div class="predict-fields"><label class="predict-field"><span>预测目标</span><select id="prediction-target" name="target"><option value="synthesizability">可合成性评分</option><option value="stability">稳定性筛选</option><option value="properties">性质批量预测</option></select></label><label class="predict-field"><span>E_hull（可选，eV/atom）</span><input id="ehull-input" name="ehull" type="number" min="0" step="0.001" placeholder="例如 0.025…" inputmode="decimal" /></label></div>
            <button class="primary-button predict-submit" id="submit-button" type="submit">创建预测任务 <i data-lucide="arrow-right" aria-hidden="true"></i></button><p class="predict-status" id="upload-status" role="status" aria-live="polite" hidden></p>
          </form>
          <aside class="job-queue" aria-labelledby="job-title"><div class="job-state-line"><i aria-hidden="true"></i><span>预测服务 · 演示队列</span></div><h2 id="job-title">等待新的预测任务</h2><dl class="job-meta"><div><dt>任务编号</dt><dd id="job-id">—</dd></div><div><dt>文件</dt><dd id="job-file">—</dd></div><div><dt>目标</dt><dd id="job-target">—</dd></div><div><dt>状态</dt><dd id="job-state">未开始</dd></div></dl></aside>
        </div>
      </section>
    </main>
    <footer class="site-footer"><span>Synthesis Atlas · 材料可合成性数据库原型</span><span>任务创建为演示状态，不产生真实计算资源</span></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="../shared/site.js"></script><script src="script.js"></script>
  </body>
</html>
